name: Performance — API Load Tests (Manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: qa
        type: choice
        options: [qa, staging]
      thread_count:
        description: 'Concurrent threads for load test'
        required: true
        default: '10'
        type: string
      duration_seconds:
        description: 'Load test duration in seconds'
        required: true
        default: '30'
        type: string
      p95_sla_ms:
        description: 'P95 latency SLA in milliseconds (build fails if breached)'
        required: true
        default: '500'
        type: string

jobs:
  performance:
    name: Load tests — ${{ inputs.environment }} (${{ inputs.thread_count }} threads / ${{ inputs.duration_seconds }}s)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile
        run: mvn clean compile -q

      - name: Run performance tests
        run: |
          mvn test \
            -Dtestng.suite.file=testng-ci.xml \
            -Dgroups=performance \
            -Denv=${{ inputs.environment }} \
            -Dheadless=true \
            -Dperformance.threads=${{ inputs.thread_count }} \
            -Dperformance.duration=${{ inputs.duration_seconds }} \
            -Dperformance.p95.sla=${{ inputs.p95_sla_ms }} \
            -Dsurefire.reportNameSuffix=performance

      - name: Upload HTML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-reports-${{ inputs.environment }}
          path: reports/**/*.html
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload observability events (NDJSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-events-performance-${{ inputs.environment }}
          path: logs/test-events.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Surefire XML results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-results-performance
          path: target/surefire-reports/
          retention-days: 30
