name: Secret scan

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan new commits for committed secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source (full history, so the scanned commit range is available)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan with gitleaks
        # Scans the commits of the push or pull request, not the whole history. The history
        # already contains credentials that were committed and later removed; those need
        # rotating and a history rewrite (see README, "Secrets"), and would fail every scan
        # of a new branch if the whole history were scanned. Rules and the test-source
        # allowlist are in .gitleaks.toml.
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
