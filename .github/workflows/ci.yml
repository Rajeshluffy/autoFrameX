name: CI — Build, Test and Quality Gates

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test and check every module
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Verify Chrome installation
        run: |
          google-chrome --version
          chromedriver --version

      - name: Build, test and check every module (merge gate)
        # One reactor build runs EVERY module's own default suite (core, selenium, api,
        # database, cucumber, performance, security, testkit) and then the checks bound to
        # the verify phase, so a pull request that breaks any module fails here:
        #   - the tests of each module,
        #   - the JaCoCo line-coverage floor of each module (jacoco.minimum.line in its pom),
        #   - PMD violations of priority 1-2 and SpotBugs High findings.
        # Checkstyle is report-only on purpose (see the root pom). This used to install with
        # -DskipTests and then test only autoframex-selenium, so five modules' tests never
        # gated anything. "install" (not just "verify") so the single-module steps below can
        # resolve their reactor dependencies from the local repository.
        run: mvn -B -ntp clean install -Denv=qa -Dheadless=true -Dsurefire.reportNameSuffix=ci

      - name: Run parallel execution smoke suite
        # Genuinely exercises parallel="methods" thread-count=5 against a real
        # WebDriver pool (public site, no local app dependency) — this is the
        # regression gate for pool/thread-safety behavior under concurrency, unlike
        # testng-data-provider.xml/testng-targeted.xml which are parallel-capable
        # templates with no test classes wired in. A single-suite run covers little of the
        # module, so the coverage floor is skipped here (it was enforced above).
        run: |
          mvn -B -ntp test \
            -pl autoframex-selenium \
            -Dtestng.suite.file=testng-parallel-smoke.xml \
            -Dheadless=true \
            -Djacoco.skip=true \
            -Dsurefire.reportNameSuffix=parallel-smoke

      - name: Run Cucumber lifecycle smoke suite
        # The Cucumber hooks, a step class extending CucumberProjectBase and the driver pool, with a
        # real headless Chrome and no network: BASE_URL is a data: page the scenario reads the title of.
        # -DfailIfNoTests=true because Cucumber merges the options of runner superclasses and a wrong
        # feature path or tag filter selects nothing, which otherwise ends as a green run of zero tests.
        env:
          BASE_URL: 'data:text/html,<title>autoFrameX smoke</title>'
        run: |
          mvn -B -ntp test \
            -pl autoframex-cucumber \
            -Dtestng.suite.file=testng-smoke.xml \
            -Dheadless=true \
            -DfailIfNoTests=true \
            -Djacoco.skip=true \
            -Dsurefire.reportNameSuffix=cucumber-smoke

      - name: Run performance browser smoke suite
        # PerformanceTestBase measuring a page in a real headless Chrome (a data: page, no network):
        # openBrowser, measurePageLoad, and the browser returned to the pool afterwards.
        # -DfailIfNoTests=true so a suite that selects nothing fails instead of passing with zero tests.
        run: |
          mvn -B -ntp test \
            -pl autoframex-performance \
            -Dtestng.suite.file=testng-smoke.xml \
            -Dheadless=true \
            -DfailIfNoTests=true \
            -Djacoco.skip=true \
            -Dsurefire.reportNameSuffix=performance-smoke

      - name: Verify retry engine (expected failures — does not gate merges)
        # RetryTest's methods are intentionally always-failing; they test the
        # RetryEngine's own retry/backoff behavior, not application regressions.
        run: |
          mvn -B -ntp test \
            -pl autoframex-selenium \
            -Dtestng.suite.file=testng-ci-retry.xml \
            -Denv=qa \
            -Dheadless=true \
            -Djacoco.skip=true \
            -Dsurefire.reportNameSuffix=ci-retry
        continue-on-error: true

      - name: Upload Surefire test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-results-ci
          path: '**/target/surefire-reports/'
          retention-days: 14

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports-ci
          path: '**/target/site/jacoco/'
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload observability events
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-events-ci
          # Written relative to whichever module's working directory Surefire
          # used (autoframex-selenium here, not the repo root) — glob for it.
          path: '**/logs/test-events.json'
          if-no-files-found: ignore
          retention-days: 14
