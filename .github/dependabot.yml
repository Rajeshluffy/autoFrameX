version: 2

updates:
  # Maven: the root pom manages every dependency version through properties, so one entry for the
  # reactor root covers all modules. Related libraries are grouped so they move together in one PR.
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    ignore:
      # Surefire 3.6+ cannot run a TestNG suite XML file, which every module here uses (see the comment on the
      # plugin in the root pom). Without this Dependabot reopens the same breaking update every week.
      - dependency-name: "org.apache.maven.plugins:maven-surefire-plugin"
        versions: [">=3.6.0"]
      # 4.10.4.0 and later need Maven 3.8.9; the build supports 3.8.8 (enforcer rule in the root pom).
      - dependency-name: "com.github.spotbugs:spotbugs-maven-plugin"
        versions: [">=4.10.4.0"]
    groups:
      selenium:
        patterns: ["org.seleniumhq.selenium:*"]
      cucumber:
        patterns: ["io.cucumber:*"]
      logging:
        patterns: ["ch.qos.logback:*", "org.slf4j:*", "net.logstash.logback:*"]
      apache-poi:
        patterns: ["org.apache.poi:*", "org.apache.xmlbeans:*"]
      rest-assured:
        patterns: ["io.rest-assured:*"]
      maven-plugins:
        patterns: ["org.apache.maven.plugins:*", "org.jacoco:*", "com.github.spotbugs:*", "org.owasp:*"]

  # GitHub Actions: the workflows pin actions to version tags; this keeps those tags current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
