# ============================================================
# Browser Settings
# ============================================================
autoFrameX.browser.name=chrome
autoFrameX.browser.isheadless=false

# ============================================================
# Wait Times
# ============================================================
# Implicit wait (seconds) — applied globally at WebDriver level
autoFrameX.implicit.wait.time=10

# Explicit / Fluent wait default timeout (seconds)
autoFrameX.explicit.wait.time=20

# pageLoadTimeout(seconds)
autoFrameX.page.load.timeout=30

# scriptTimeout(seconds)
autoFrameX.script.load.timeout=30

# Short wait used for alerts and disappearance checks (seconds)
autoFrameX.short.wait.time=5

# Fluent wait polling interval (milliseconds)
autoFrameX.polling.interval.ms=500

# Default wait timeout for WebDriverWait fallback in pool/test base (seconds)
autoFrameX.default.wait.timeout=15

# ============================================================
# Retry Settings
# ============================================================
# Max TestNG-level retries per failing test
autoFrameX.test.retry.max.limit=4

# Max element-level interaction retries inside SeleniumBase
autoFrameX.element.max.retry.attempts=3

# ============================================================
# WebDriver Object Pool
# ============================================================
autoFrameX.pool.max.size=5
autoFrameX.pool.max.idle.minutes=10

# Minimum drivers pre-warmed per browser type at pool startup (avoids cold-start latency)
autoFrameX.pool.min.size=2

# Seconds a borrow attempt blocks before throwing DriverAcquisitionException
autoFrameX.pool.borrow.timeout.seconds=30

# Max test uses per driver before auto-retirement (prevents memory / fd leaks)
autoFrameX.pool.max.reuse.count=75

# true  → browser windows closed after every @Test (clean slate, default)
# false → healthy driver is returned to pool for reuse (faster, less isolation)
autoFrameX.pool.close.after.each=true

# ============================================================
# Selenium Grid / Remote Execution
# ============================================================
# Set to true to route all driver creation through Selenium Grid (GRID_* browser types)
autoFrameX.grid.enabled=false

# Selenium Grid Hub URL (Selenium 4 Node URL or legacy /wd/hub endpoint)
autoFrameX.grid.hub.url=http://localhost:4444/wd/hub


