# ============================================================
# Browser Settings
# ============================================================
autoFrameX.browser.name=chrome
autoFrameX.browser.isheadless=false

# ============================================================
# Wait Times
# ============================================================
# Implicit wait (seconds) — applied globally at WebDriver level
autoFrameX.implicit.wait.time=10

# Explicit / Fluent wait default timeout (seconds)
autoFrameX.explicit.wait.time=20

# pageLoadTimeout(seconds)
autoFrameX.page.load.timeout=30

# scriptTimeout(seconds)
autoFrameX.script.load.timeout=30

# Short wait used for alerts and disappearance checks (seconds)
autoFrameX.short.wait.time=5

# Fluent wait polling interval (milliseconds)
autoFrameX.polling.interval.ms=500

# Default wait timeout for WebDriverWait fallback in pool/test base (seconds)
autoFrameX.default.wait.timeout=15

# ============================================================
# Retry Settings
# ============================================================
# Max TestNG-level retries per failing test. One retry absorbs a genuine flake; more than that
# mostly repeats a UI flow that is not safe to repeat (it created a record before failing later)
# and hides how unstable the test is. A test that needs more opts in with @Retry(limit = n).
autoFrameX.test.retry.max.limit=1

# Retries for API-style tests: tests in the TestNG groups below. Retrying an API test can
# repeat a call that is not safe to repeat (create, pay, delete), so the default is no
# retry. A test opts in with @Retry(limit = n), which always overrides this and the
# global limit above. Override per run: -DretryApiLimit=1, or <parameter name="retryApiLimit" .../>.
autoFrameX.test.retry.api.max.limit=0
autoFrameX.test.retry.api.groups=api,performance

# Max element-level interaction retries inside SeleniumBase
autoFrameX.element.max.retry.attempts=3

# ============================================================
# WebDriver Object Pool
# ============================================================
autoFrameX.pool.max.size=5
autoFrameX.pool.max.idle.minutes=10

# Minimum drivers pre-warmed per browser type at pool startup (avoids cold-start latency)
autoFrameX.pool.min.size=2

# Seconds a borrow attempt blocks before throwing DriverAcquisitionException
autoFrameX.pool.borrow.timeout.seconds=30

# Max test uses per driver before auto-retirement (prevents memory / fd leaks)
autoFrameX.pool.max.reuse.count=75

# true  → browser fully quit after every @Test (a new browser per test, default)
# false → healthy driver is returned to pool for reuse (faster, less isolation)
autoFrameX.pool.close.after.each=true

# ============================================================
# Selenium Grid / Remote Execution
# ============================================================
# Set to true to route all driver creation through Selenium Grid (GRID_* browser types)
autoFrameX.grid.enabled=false

# Selenium Grid Hub URL (Selenium 4 Node URL or legacy /wd/hub endpoint)
autoFrameX.grid.hub.url=http://localhost:4444/wd/hub



# ============================================================
# API Capture (Chrome DevTools Network domain)
# ============================================================
# Opt-in PER PROJECT: the framework default is false. A child project turns it
# on in its OWN properties file (e.g. alfaDOCKConfig.properties, searched before
# this file) with the same key, or per suite with
# <parameter name="apiCaptureEnabled" value="true"/> in its suite XML.
# true  -> every API request the browser sends during a test (XHR, fetch,
#          document navigations; static assets excluded) is saved as a
#          Postman-importable cURL under
#          reports/<run>/apicapture/<testcase>/<method>_<account>_<NN>/
#          plus one collected_apis.txt per folder. Chromium browsers only;
#          silently skipped for Firefox or when DevTools is unreachable.
# false -> no DevTools session is opened at all.
# Priority: suite <parameter> > env API_CAPTURE_ENABLED > -DapiCaptureEnabled >
# project properties file > this file.
autoFrameX.api.capture.enabled=false

# true -> Authorization/Cookie-style header values and credential-looking
#         body fields are written as *** (the files are then NOT replayable).
autoFrameX.api.capture.mask.secrets=false
