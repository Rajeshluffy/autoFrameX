services:
  jenkins:
    build: .                      # Dockerfile next to this file: jenkins lts-jdk21 + docker CLI
    image: jenkins-docker:lts-jdk21
    container_name: jenkins
    restart: unless-stopped
    user: root
    ports:
      - "8080:8080"    # Jenkins UI — open from PC-1: http://<PC2-IP>:8080
      - "50000:50000"  # Jenkins agent port
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock  # Let Jenkins run Docker commands
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock

volumes:
  jenkins_home:
