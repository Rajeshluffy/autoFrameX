version: '3.9'

services:

  autoframex-tests:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoframex-tests
    environment:
      BROWSER: ${BROWSER:-chrome}
      ENVIRONMENT: ${ENVIRONMENT:-qa}
      HEADLESS: ${HEADLESS:-true}
      SUITE_FILE: ${SUITE_FILE:-testng.xml}
      # Reactor module that owns SUITE_FILE above (TD-20 multi-module split).
      # Change alongside SUITE_FILE if you point at a suite owned by a
      # different module (e.g. MODULE=autoframex-selenium for testng-ci.xml).
      MODULE: ${MODULE:-autoframex-testkit}
    volumes:
      # Paths are relative to the MODULE default (autoframex-testkit) since
      # Surefire's working directory is the invoking module's own basedir,
      # not the reactor root — update these to match if you override MODULE.
      - ./autoframex-testkit/reports:/app/autoframex-testkit/reports
      - ./autoframex-testkit/logs:/app/autoframex-testkit/logs
      - ./autoframex-testkit/target/surefire-reports:/app/autoframex-testkit/target/surefire-reports
    # Uncomment the block below when using Selenium Grid (selenium-hub service)
    # depends_on:
    #   selenium-hub:
    #     condition: service_healthy

  # ── Selenium Grid (optional) ─────────────────────────────────────────────────
  # Uncomment this service and the depends_on block above to route tests through
  # a local Selenium Grid instead of the Chrome binary inside the container.
  # Also add to autoframex-tests environment:
  #   GRID_ENABLED: "true"
  #   GRID_HUB_URL: "http://selenium-hub:4444/wd/hub"
  #
  # selenium-hub:
  #   image: selenium/hub:4.21.0
  #   container_name: selenium-hub
  #   ports:
  #     - "4444:4444"
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:4444/wd/hub/status"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #
  # selenium-chrome:
  #   image: selenium/node-chrome:4.21.0
  #   container_name: selenium-chrome
  #   depends_on:
  #     - selenium-hub
  #   environment:
  #     SE_EVENT_BUS_HOST: selenium-hub
  #     SE_EVENT_BUS_PUBLISH_PORT: 4442
  #     SE_EVENT_BUS_SUBSCRIBE_PORT: 4443

  # ── OWASP ZAP (optional) ─────────────────────────────────────────────────────
  # Uncomment to run security tests locally via ZapSecurityUtils.
  # Also add to autoframex-tests environment:
  #   ZAP_BASE_URL: "http://zap:8080"
  #   zap.base.url: "http://zap:8080"   (passed as -Dzap.base.url in ENTRYPOINT)
  #
  # zap:
  #   image: ghcr.io/zaproxy/zaproxy:stable
  #   container_name: zap
  #   command: zap.sh -daemon -host 0.0.0.0 -port 8080 -config api.disablekey=true
  #   ports:
  #     - "8080:8080"
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8080/JSON/core/view/version/"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 10
