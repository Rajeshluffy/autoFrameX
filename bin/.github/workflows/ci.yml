name: CI — Framework Smoke Check

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Compile & Framework Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Verify Chrome installation
        run: |
          google-chrome --version
          chromedriver --version

      - name: Build and install all modules (multi-module reactor — TD-20)
        # A plain "mvn clean compile" no longer suffices: autoframex-selenium
        # (which owns testng-ci.xml et al.) depends on autoframex-core as a
        # reactor artifact, so every module needs to be installed to the local
        # repo before a single-module `-pl` test run below can resolve it.
        run: mvn clean install -DskipTests -Djacoco.skip=true -q

      - name: Run framework unit tests
        # testng-ci.xml (autoframex-selenium) excludes CucumberRunner (needs a
        # real browser) and RetryTest (see below) — this step's pass/fail is
        # the real merge gate.
        run: |
          mvn test \
            -pl autoframex-selenium \
            -Dtestng.suite.file=testng-ci.xml \
            -Denv=qa \
            -Dheadless=true \
            -Dsurefire.reportNameSuffix=ci

      - name: Run parallel execution smoke suite
        # Genuinely exercises parallel="methods" thread-count=5 against a real
        # WebDriver pool (public site, no local app dependency) — this is the
        # real regression gate for pool/thread-safety behavior under
        # concurrency, unlike testng-data-provider.xml/testng-targeted.xml
        # which are parallel-capable templates with no test classes wired in.
        run: |
          mvn test \
            -pl autoframex-selenium \
            -Dtestng.suite.file=testng-parallel-smoke.xml \
            -Dheadless=true \
            -Dsurefire.reportNameSuffix=parallel-smoke

      - name: Verify retry engine (expected failures — does not gate merges)
        # RetryTest's methods are intentionally always-failing; they test the
        # RetryEngine's own retry/backoff behavior, not application regressions.
        run: |
          mvn test \
            -pl autoframex-selenium \
            -Dtestng.suite.file=testng-ci-retry.xml \
            -Denv=qa \
            -Dheadless=true \
            -Dsurefire.reportNameSuffix=ci-retry
        continue-on-error: true

      - name: Enforce coverage floor + static analysis (report-only)
        # jacoco:check is bound to the "verify" phase, so it doesn't run during
        # the "mvn test" steps above — this step reads the jacoco.exec those
        # steps already accumulated in autoframex-selenium's own target/ and
        # enforces the coverage floor against it. Scoped to autoframex-selenium
        # (-pl, no -am) since that's the only module this job's test steps
        # actually exercised — running `mvn verify` reactor-wide would fail
        # every other module's coverage floor at 0%, since none of their own
        # tests ran in this job (a known simplification: this doesn't attempt
        # cross-module JaCoCo aggregation). -Dmaven.test.skip=true means no
        # tests re-run here; Checkstyle/PMD/SpotBugs also run but are
        # report-only (see pom.xml) — they log findings without failing the
        # build until the existing violation backlog is cleared.
        run: mvn verify -pl autoframex-selenium -Dmaven.test.skip=true

      - name: Upload Surefire test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-results-ci
          path: '**/target/surefire-reports/'
          retention-days: 14

      - name: Upload observability events
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-events-ci
          # Written relative to whichever module's working directory Surefire
          # used (autoframex-selenium here, not the repo root) — glob for it.
          path: '**/logs/test-events.json'
          if-no-files-found: ignore
          retention-days: 14
